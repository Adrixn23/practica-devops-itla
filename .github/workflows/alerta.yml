name: Alerta

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Enviar notificacion a ntfy
        run: |
          curl -d "Se ha realizado un push en la rama main" https://ntfy.sh/devops-itla
